  <button id="sheet-backdrop" aria-label="关闭当前面板"></button>
  <div id="body-labels" class="hud-layer" aria-hidden="true"></div>
  <div id="object-tooltip" hidden></div>
  <section id="scene-observation" class="hud-layer" aria-label="当前观测场景">
    <div id="scene-title">太阳系 · 引力与轨道</div>
    <div id="scene-subtitle">拖动旋转，滚轮缩放。点击天体查看档案与实时轨道。</div>
    <div id="scene-transport" aria-label="仿真快捷控制">
      <button id="transport-pause" aria-pressed="false" title="暂停或继续全部物理运动">Ⅱ 暂停</button>
      <button id="transport-speed" title="循环切换时间速度">1.0×</button>
      <span id="transport-time" class="font-mono-tech">00:00</span>
      <button id="transport-trails" aria-pressed="true" title="显示或隐藏运动轨迹">轨迹</button>
      <button id="transport-gravity" aria-pressed="false" title="显示或隐藏引力方向">引力</button>
      <button id="transport-home" title="返回当前场景全景">⌖ 全景</button>
    </div>
  </section>
